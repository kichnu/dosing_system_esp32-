; DOZOWNIK - PlatformIO Configuration
; ESP32-S3-ZERO (Seeed Studio XIAO)
;
; Środowiska:
;   production      - bez CLI, minimalny kod, upload przez USB
;   debug           - pełne CLI i logi, upload przez USB
;   production_ota  - jak production, upload przez WiFi (espota)
;   debug_ota       - jak debug, upload przez WiFi (espota)

[platformio]
default_envs = production

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Upload & Monitor
monitor_speed = 115200
upload_speed = 921600

; Partition scheme - 16MB flash, dwa sloty OTA (app0+app1, 3MB każdy)
board_build.partitions = app3M_fat9M_16MB.csv


; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Common includes
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DOTA_PASSWORD=\"${sysenv.OTA_PASSWORD}\"
    -Isrc/config
    -Isrc/hardware
    -Isrc/web
    -Isrc/algorithm
    -Isrc/rtc_controller

; Common libraries
lib_deps =
    Wire
    mathieucarbou/AsyncTCP@^3.2.14
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    bblanchon/ArduinoJson@^7.2.1

; =============================================================================
; PRODUCTION - bez CLI, minimalne logi
; =============================================================================
[env:production]
build_flags =
    ${env.build_flags}
    -DENABLE_CLI=0
    -DCORE_DEBUG_LEVEL=0
    -DPRODUCTION_MODE=1

; =============================================================================
; DEBUG - pełne CLI i logi
; =============================================================================
[env:debug]
build_flags =
    ${env.build_flags}
    -DENABLE_CLI=1
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_MODE=1

; =============================================================================
; PRODUCTION OTA - upload przez WiFi (wymaga OTA_PASSWORD w env shella)
; =============================================================================
[env:production_ota]
extends = env:production
upload_protocol = espota
upload_port = dozownik.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    --host_port=8266

; =============================================================================
; DEBUG OTA - upload przez WiFi (wymaga OTA_PASSWORD w env shella)
; =============================================================================
[env:debug_ota]
extends = env:debug
upload_protocol = espota
upload_port = dozownik.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    --host_port=8266